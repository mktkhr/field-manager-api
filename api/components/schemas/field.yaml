# 圃場関連スキーマ定義

# 座標オブジェクト
Coordinate:
  type: object
  required:
    - lat
    - lng
  properties:
    lat:
      type: number
      format: double
      description: 緯度
    lng:
      type: number
      format: double
      description: 経度

# カーソルベースページネーションメタ情報
CursorPaginationMeta:
  type: object
  required:
    - hasMore
    - pageSize
  properties:
    nextCursor:
      type: string
      nullable: true
      description: 次ページ取得用カーソル(最終ページの場合はnull)
    hasMore:
      type: boolean
      description: 次ページが存在するか
    pageSize:
      type: integer
      description: 1ページあたりの件数

# レスポンスメタ情報
ResponseMeta:
  type: object
  required:
    - pagination
  properties:
    pagination:
      $ref: "./field.yaml#/CursorPaginationMeta"

Field:
  type: object
  required:
    - id
    - name
    - cityCode
    - geometry
    - centroid
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      maxLength: 255
      description: 圃場名
    cityCode:
      type: string
      description: 市区町村コード
    soilTypeId:
      type: string
      format: uuid
      nullable: true
      description: 土壌タイプID
    areaSqm:
      type: number
      format: double
      nullable: true
      description: 面積(平方メートル)
    geometry:
      type: array
      items:
        $ref: "./field.yaml#/Coordinate"
      description: ポリゴンの頂点座標配列
    centroid:
      $ref: "./field.yaml#/Coordinate"
      description: 重心座標

FieldListData:
  type: object
  required:
    - fields
  properties:
    fields:
      type: array
      items:
        $ref: "./field.yaml#/Field"

FieldListResponse:
  type: object
  required:
    - data
    - meta
    - errors
  properties:
    data:
      allOf:
        - $ref: "./field.yaml#/FieldListData"
      nullable: true
    meta:
      allOf:
        - $ref: "./field.yaml#/ResponseMeta"
      nullable: true
    errors:
      type: array
      nullable: true
      items:
        $ref: "./common.yaml#/Error"

FieldResponse:
  type: object
  required:
    - data
    - errors
  properties:
    data:
      allOf:
        - $ref: "./field.yaml#/Field"
      nullable: true
    errors:
      type: array
      nullable: true
      items:
        $ref: "./common.yaml#/Error"
